services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: baseforte
      POSTGRES_PASSWORD: baseforte
      POSTGRES_DB: baseforte
    ports: ["5433:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseforte"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  api:
    build: { context: ., dockerfile: api/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://baseforte:baseforte@db:5432/baseforte
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3001:3001"]
    volumes: [uploads:/data/uploads]
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    environment:
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on: [api]
    ports: ["3006:3000"]
volumes:
  dbdata:
  uploads:
